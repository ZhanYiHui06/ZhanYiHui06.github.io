# Only if the server already runs nginx; otherwise Caddyfile is simpler.
# HTTPS: sudo certbot --nginx -d example.com -d www.example.com
# Put this in /etc/nginx/conf.d/personal-page.conf, then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name example.com www.example.com;

    root /var/www/personal-page;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    server_tokens off;
}
