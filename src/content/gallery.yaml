# 摄影画廊（/gallery）的全部内容。
#
# 换照片只需要两步：
#   1. 把原图放进 src/assets/gallery/（jpg / png / webp 都行，直接放相机或手机导出的原图，
#      构建时会自动压缩成多种尺寸的 AVIF 和 WebP，不用自己处理）
#   2. 在下面 photos 里按想要的顺序列出来，file 写文件名
# 横图、竖图、方图会自动排成错落的版式；顺序决定版式，可以多试几种排列。

meta:
  title: 摄影
  description: 詹毅辉拍的照片。

# 现在是示例照片：不让搜索引擎收录，并在页脚注明。换成自己的照片后改成 false。
draft: true

title: 留住的光
en: Light, kept.
intro: 走路时停下来的那几秒。

photos:
  # file 必填；其余都可以省略
  #   title  作品名        place  地点        date  时间（随便写，如 2025 秋）
  #   camera 器材/参数，如 "X100V · f/2 · 1/500s"
  #   alt    给读屏软件的画面描述（没写就用 title）
  #   credit / source  图片作者和出处（用别人的图时写，自己拍的不用）
  # 下面是 Wikimedia Commons 上的 CC0 示例照片，换成自己的之后连同 src/assets/gallery/ 里的文件一起删掉
  - file: 01-jetty-fog.jpg
    title: 雾中栈桥
    place: 瑞典 Holländaröd
    date: "2018"
    alt: 雾里伸进水面的木栈桥，远处什么也看不见
