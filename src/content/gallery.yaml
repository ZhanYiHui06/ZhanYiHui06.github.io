# 摄影画廊（/gallery）的全部内容。
#
# 换照片只需要两步：
#   1. 把原图放进 src/assets/gallery/（jpg / png / webp 都行，直接放相机或手机导出的原图，
#      构建时会自动压缩成多种尺寸的 AVIF 和 WebP，不用自己处理）
#   2. 在下面 photos 里按想要的顺序列出来，file 写文件名
# 照片墙会自动把它们发到各列里；全屏浏览和编号按这里的顺序。

meta:
  title: 摄影
  description: 詹毅辉拍的照片。

# draft: true 时页面不让搜索引擎收录，并在「关于」里注明是示例照片。
draft: false

# 标题和 alt 描述是根据画面先填的，地点只写了能认出来的，都可以随便改。

