note:
  title: 工作习惯 # hand
  en: How I work
  paragraphs:
    - 我在日常用软件时有点“轻微强迫症”：看到字重不统一的弹窗、点完没反馈的按钮、或者让人多点两次鼠标的导出流程，心里就会觉得别扭，忍不住想如果是我会怎么改。
    - 这种别扭感通常就是我动手做东西的起点。不管是写插件还是改社团网页，我的习惯都是先把自己当成最挑剔的那个用户，完整走一遍流程，再把那些硌手的地方一点点磨平。另外，我非常喜欢把杂乱的信息整理成清爽的文档和看板，大概是 INFJ 刻在骨子里的秩序感。

