note:
  title: 在意细节的 INFJ # hand
  paragraphs:
    - 我喜欢一切好看的东西，也很容易注意到别人略过的细节：一个别扭的按钮，一句说不清的文案，一个让人犹豫的步骤。
    - 所以我做产品的习惯很简单：先当用户把它完整用一遍，再动手把它改好。

